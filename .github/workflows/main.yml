name: Build Wild Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
        fetch-depth: 0

    - name: Set up Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev lz4 libncurses5-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 libelf-dev

    - name: Download Clang Toolchain
      run: |
        mkdir -p clang
        cd clang
        curl -LO https://github.com/kdrag0n/proton-clang/archive/refs/heads/master.tar.gz
        tar -xf master.tar.gz --strip-components=1
        cd ..

    - name: Build Kernel
      run: |
        export PATH="$(pwd)/clang/bin:$PATH"
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        
        echo "============================================="
        echo "          STARTING WILD KERNEL BUILD         "
        echo "============================================="
        curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/legacy/kernel/setup.sh" | bash -s legacy

        make O=out vendor/spes-perf_defconfig CC=clang HOSTCC=clang
        echo "CONFIG_MODULES=y" >> out/.config
        echo "CONFIG_KPROBES=y" >> out/.config
        echo "CONFIG_HAVE_KPROBES=y" >> out/.config
        echo "CONFIG_KPROBE_EVENTS=y" >> out/.config
        echo "CONFIG_KSU=y" >> out/.config
        echo "CONFIG_KSU_NEXT=y" >> out/.config
        make O=out olddefconfig CC=clang HOSTCC=clang
        
        make -j$(nproc --all) O=out \
                      CC=clang \
                      HOSTCC=clang \
                      LD=ld.lld \
                      AR=llvm-ar \
                      NM=llvm-nm \
                      OBJCOPY=llvm-objcopy \
                      OBJDUMP=llvm-objdump \
                      STRIP=llvm-strip \
                      KCFLAGS="-O3 -pipe"
        
        echo "============================================="
        echo "          CHECKING KERNEL OUTPUT             "
        echo "============================================="
        
        if [ -f out/arch/arm64/boot/Image.gz ]; then
          echo "SUCCESS: Image.gz found!"
          echo "KERNEL_PATH=out/arch/arm64/boot/Image.gz" >> $GITHUB_ENV
        elif [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
          echo "SUCCESS: Image.gz-dtb found!"
          echo "KERNEL_PATH=out/arch/arm64/boot/Image.gz-dtb" >> $GITHUB_ENV
        else
          echo "ERROR: No kernel image found! Build genuinely failed."
          exit 1
        fi

    - name: Pack with AnyKernel3
      run: |
        git clone --depth=1 https://github.com/muralivijay/AnyKernel3.git AnyKernel3
        cp ${{ env.KERNEL_PATH }} AnyKernel3/
        cd AnyKernel3
        zip -r9 ../Wild-Kernel-Flashable.zip *
        cd ..

    - name: Upload Flashable Zip
      uses: actions/upload-artifact@v4
      with:
        name: Wild-Kernel-Release
        path: Wild-Kernel-Flashable.zip
        
