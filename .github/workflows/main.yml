name: Build Chrysalis Kernel

on:
  workflow_dispatch:

env:
  DEFCONFIG: vendor/spes-perf_defconfig
  ARCH: arm64
  SUBARCH: arm64
  KERNEL_NAME: Chrysalis Kernel

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
        fetch-depth: 0

    - name: Set up Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev lz4 libncurses5-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 libelf-dev

    - name: Download Clang Toolchain
      run: |
        mkdir -p clang
        cd clang
        curl -LO https://github.com/ZyCromerZ/Clang/archive/refs/tags/16.0.6-20260716-release.tar.gz
        tar -xf 16.0.6-20260716-release.tar.gz --strip-components=1
        cd ..

    - name: Build Chrysalis Kernel
      run: |
        CLANG_BIN=$(find $(pwd)/clang -type d -name "bin" | head -n 1)
        export PATH="$CLANG_BIN:$PATH"
        export ARCH=${{ env.ARCH }}
        export SUBARCH=${{ env.SUBARCH }}
        
        echo "============================================="
        echo "          STARTING KERNEL BUILD              "
        echo "============================================="
        sed -i 's/local short/return 0/g' scripts/setlocalversion     
        curl -LSs "https://raw.githubusercontent.com/xxblebleblexx/MultiSU/refs/heads/legacy/kernel/setup.sh" | bash -s legacy
        curl -LSs "https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/mainline/Patches/syscall_hook_patches.sh" | bash -s mainline
        curl -LSs "https://raw.githubusercontent.com/xxblebleblexx/nomount-installer/refs/heads/installer/nomount.sh" | bash -s 4.19
        echo "CONFIG_MODULES=y" >> arch/${{ env.ARCH }}/configs/${{ env.DEFCONFIG }}
        echo "CONFIG_KSU=y" >> arch/${{ env.ARCH }}/configs/${{ env.DEFCONFIG }}
        echo "CONFIG_KSU_MANUAL_HOOK=y" >> arch/${{ env.ARCH }}/configs/${{ env.DEFCONFIG }}
        echo "CONFIG_KSU_NEXT=y" >> arch/${{ env.ARCH }}/configs/${{ env.DEFCONFIG }}
        echo "CONFIG_KSU_TAMPER_SYSCALL_TABLE=y" >> arch/${{ env.ARCH }}/configs/${{ env.DEFCONFIG }}
        echo "CONFIG_NOMOUNT=y" >> arch/${{ env.ARCH }}/configs/${{ env.DEFCONFIG }}
        make O=out ${{ env.DEFCONFIG }} CC=clang LD=ld.lld
        make O=out olddefconfig CC=clang LD=ld.lld
        
        make -j$(nproc --all) O=out \
                      CC=clang \
                      HOSTCC=clang \
                      LD=ld.lld \
                      AR=llvm-ar \
                      NM=llvm-nm \
                      OBJCOPY=llvm-objcopy \
                      OBJDUMP=llvm-objdump \
                      STRIP=llvm-strip \
                      KCFLAGS="-O2 -pipe"
        
        echo "============================================="
        echo "          COLLECTING ALL COMPILED FILES      "
        echo "============================================="
        
        mkdir -p build_artifacts

        find out/arch/${{ env.ARCH }}/boot/ -maxdepth 1 -type f \( -name "Image*" -o -name "*.img" \) -exec cp {} ./build_artifacts/ \;

        if [ -z "$(ls -A build_artifacts)" ]; then
          echo "ERROR: No kernel artifacts found! Build failed."
          exit 1
        fi

    - name: Upload Kernel Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.KERNEL_NAME }}-Artifacts
        path: build_artifacts/*
