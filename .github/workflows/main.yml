name: Build Wild Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
        fetch-depth: 0

    - name: Set up Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev lz4 libncurses5-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 libelf-dev

    - name: Download Cirrus Clang Toolchain
      run: |
        mkdir -p clang
        cd clang
        curl -LSs "https://raw.githubusercontent.com/greenforce-project/greenforce_clang/refs/heads/main/get_clang.sh" | bash
        cd ..

    - name: Build Kernel
      run: |
        export PATH="$(pwd)/clang/bin:$PATH"
        export ARCH=arm64
        export SUBARCH=arm64
        
        echo "============================================="
        echo "          STARTING WILD KERNEL BUILD         "
        echo "============================================="
        sed -i 's/local short/return 0/g' scripts/setlocalversion

        curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/legacy/kernel/setup.sh" | bash -s legacy

        curl -LSs "https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/mainline/Patches/syscall_hook_patches.sh" | bash -s mainline

        echo "CONFIG_MODULES=y" >> arch/arm64/configs/vendor/spes-perf_defconfig
        echo "CONFIG_KSU=y" >> arch/arm64/configs/vendor/spes-perf_defconfig
        echo "CONFIG_KSU_MANUAL_HOOK=y" >> arch/arm64/configs/vendor/spes-perf_defconfig
        echo "CONFIG_KSU_NEXT=y" >> arch/arm64/configs/vendor/spes-perf_defconfig
        
        make O=out vendor/spes-perf_defconfig LLVM=1 LLVM_IAS=1
        make O=out olddefconfig LLVM=1 LLVM_IAS=1
        
        make -j$(nproc --all) O=out \
                      LLVM=1 \
                      LLVM_IAS=1 \
                      KCFLAGS="-O2 -pipe" \
                      all
        
        echo "============================================="
        echo "          COLLECTING ALL COMPILED FILES      "
        echo "============================================="
        
        mkdir -p build_artifacts

        if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
          echo "FOUND: Image.gz-dtb"
          cp out/arch/arm64/boot/Image.gz-dtb ./build_artifacts/Image.gz-dtb
        fi

        if [ -f out/arch/arm64/boot/Image.gz ]; then
          echo "FOUND: Image.gz"
          cp out/arch/arm64/boot/Image.gz ./build_artifacts/Image.gz
        fi

        if [ -f out/arch/arm64/boot/dtb.img ]; then
          echo "FOUND: dtb.img"
          cp out/arch/arm64/boot/dtb.img ./build_artifacts/dtb.img
        fi

        if [ -f out/arch/arm64/boot/dtbo.img ]; then
          echo "FOUND: dtbo.img"
          cp out/arch/arm64/boot/dtbo.img ./build_artifacts/dtbo.img
        fi

        if [ ! -f ./build_artifacts/Image.gz ] && [ ! -f ./build_artifacts/Image.gz-dtb ]; then
          echo "ERROR: Kernel image not found!"
          exit 1
        fi

    - name: Upload Kernel Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Wild-Kernel-Artifacts
        path: build_artifacts/*
