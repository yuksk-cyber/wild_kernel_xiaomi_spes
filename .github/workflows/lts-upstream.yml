name: Upstream LTS Kernel

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-kernel:
    runs-on: ubuntu-latest

    env:
      NEW_BRANCH: lts-331
      LTS_REPO: https://github.com/frstprjkt/kernel-lts.git
      TARGET_TAG: v4.19.328

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Git config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add LTS repository and fetch tags
        run: |
          git remote add kernel-lts $LTS_REPO
          git fetch kernel-lts --tags

      - name: Create new branch
        run: |
          git checkout -B $NEW_BRANCH

      - name: Merge LTS Tag directly
        run: |
          # Сливаем релизный тег напрямую с приоритетом изменений из LTS (-X theirs)
          git merge $TARGET_TAG -X theirs -m "Merge $TARGET_TAG from LTS upstream"

          git status

      - name: Check kernel version
        run: |
          grep SUBLEVEL Makefile || true

      - name: Push branch
        run: |
            git push -u origin $NEW_BRANCH --force
