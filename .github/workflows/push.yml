name: Cherry-pick Remote Commit (Test Branch)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cherry-pick:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cherry-pick to test branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Переключаемся на новую отдельную ветку для экспериментов
          git checkout -b test-mglru

          git remote add source https://github.com/xxblebleblexx/android_kernel_xiaomi_gale.git
          git fetch source 2425c6c136937f39b971382bd0900bc09f6955f7

          # Запускаем cherry-pick
          git cherry-pick 2425c6c136937f39b971382bd0900bc09f6955f7

            # Добавляем ВСЕ конфликтные файлы
            git add .
            git -c core.editor=true cherry-pick --continue

          # Пушим результат в НОВУЮ ветку test-mglru
          git push origin test-mglru --force
