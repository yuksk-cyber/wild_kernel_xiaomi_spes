name: Cherry-pick Remote Commit (Test Branch)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cherry-pick:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cherry-pick to test branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Переключаемся на новую отдельную ветку для экспериментов
          git checkout -b test-mglru

          git remote add source https://github.com/xxblebleblexx/android_kernel_xiaomi_gale.git
          git fetch source dc3dadfb7fcd386904dc2d907febf7e4f9de0dab

          # Запускаем cherry-pick
          git cherry-pick dc3dadfb7fcd386904dc2d907febf7e4f9de0dab || {
            echo "=================================================="
            echo "⚠️ ОБНАРУЖЕНЫ КОНФЛИКТЫ! Показываем vmscan.c:"
            echo "=================================================="
            
            grep -C 10 -n "<<<<<<<" mm/vmscan.c || true
            
            echo "=================================================="
            echo "Индексируем ВСЕ файлы и завершаем коммит..."
            echo "=================================================="

            # Добавляем ВСЕ конфликтные файлы (vmscan.c, mmzone.h, Kconfig, dev.c)
            git add .
            git -c core.editor=true cherry-pick --continue
          }

          # Пушим результат в НОВУЮ ветку test-mglru
          git push origin test-mglru --force
