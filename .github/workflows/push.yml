name: Cherry-pick Remote Commit (Test Branch)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cherry-pick:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cherry-pick to test branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b test-mglru

          git remote add source https://github.com/ZeroKelvinProject/Elea-4.19-android-bbr3.git
          git fetch source 382bfff9818951178d272a99225aecb13239a537

          if ! git cherry-pick 382bfff9818951178d272a99225aecb13239a537; then
            git add .
            git -c core.editor=true cherry-pick --continue
          fi

          git push origin test-mglru --force
